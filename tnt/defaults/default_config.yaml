# TNT default configuration profile, version 1.
#
# TNT will recursively merge this profile with a user configuration before
# constructing a model. The user configuration must provide the physical
# system, component definitions, input directory, and output directory.
#
# If histogram metadata is omitted for a kinematic data set, TNT derives it
# from the observations using data-type-specific rules.

# Every unitful field must state its unit explicitly. Standalone quantities use
# {value: ..., unit: ...}; unitful parameters use a sibling unit field.
# Display units are presentation preferences and do not change stored values.
units:
  internal:
    length: "kpc"
    time: "Myr"
    mass: "Msun"
    angle: "rad"
    power: "Lsun"
  display:
    angle: "arcsec"
    speed: "km / s"

cosmological_parameters:
  H0: {value: 70.0, unit: "km / (s Mpc)"}

# Fixed-order Gauss-Legendre quadrature orders for the two MGE integrals that
# aren't fully analytic: the intrinsic (3D) mass in a spherical grid cell
# (Deprojected3DMGE.spherical_mass_grid) and the projected (2D) mass in an
# aperture-grid pixel (AbstractMGE.get_projected_mass).
mge_settings:
  intrinsic_mass_quad_order: 10
  projected_mass_quad_order: 10

# Shared numerical policies. Keeping these values explicit makes model
# identity checks and solver constraints reproducible across implementations.
numerics_settings:
  model_comparison_relative_tolerance: 1.0e-10
  parameter_grid_relative_tolerance: 1.0e-6
  constraint_error_floors:
    total_mass: 1.0e-8
    intrinsic_mass: 1.0e-16

# Operational logging defaults. Logging is configured explicitly by the
# application or execution entry point; reading a configuration has no logging
# side effects. Each enabled run gets a timestamped logfile below the output
# directory.
logging_settings:
  file:
    enabled: true
    level: "DEBUG"
    directory: "logs"
  console:
    enabled: true
    level: "INFO"

# These values apply to every dynamically named object of the corresponding
# type unless the user overrides the property on that object.
dynamic_object_defaults:
  potential:
    include: true
  # `fixed` only stops the parameter generator from proposing independent
  # values for a parameter across shape points. It does not exempt a
  # potential component's mass parameter (ml, mge_mass_scale, ...) from
  # parameter_space_settings.potential_rescalings, which still rescales it --
  # every component's mass parameter must move together, fixed or not, or the
  # potential's shape would silently no longer match its orbit library. See
  # AbstractPotentialComponent.rescale in tnt/potential.py.
  parameter:
    fixed: false
    logarithmic: false

# Defaults selected by the type of each dynamically named kinematics data set.
# User-supplied values on an individual data set override these policies.
kinematics_type_defaults:
  gauss_hermite:
    # Highest Gauss-Hermite order constrained for this observational data set.
    maximum_gh_order: 4
    observational_errors:
      # Add these data-set-specific systematic uncertainties in quadrature.
      systematic_uncertainties:
        v: {value: 0.0, unit: "km / s"}
        sigma: {value: 0.0, unit: "km / s"}
        h3: 0.0
        h4: 0.0
    histogram:
      # Total width is 2 * max(abs(v) + sigma_extent * sigma).
      sigma_extent: 3.0
      # The approximate bin width is this fraction of the minimum sigma.
      bin_width_sigma_fraction: 0.1
      center: {value: 0.0, unit: "km / s"}
  bayes_losvd:
    histogram:
      # Scale relative to the symmetric width covering the observed LOSVD.
      width_scale: 1.0
      # A factor of 1 uses the observed LOSVD velocity spacing.
      oversampling_factor: 1.0
      center: {value: 0.0, unit: "km / s"}
      systemic_velocity: "flux_weighted"
  proper_motions:
    observational_errors:
      # Multiplier for the observational error variances. The corresponding
      # uncertainties are multiplied by its square root; 1.0 is neutral.
      variance_scale: 1.0
    warning_thresholds:
      # Warn if velocity-bin width / global velocity dispersion exceeds this.
      max_bin_width_sigma_ratio: 0.25
      # Warn if histogram width / global velocity dispersion falls below this.
      min_histogram_width_sigma_ratio: 5.0

# Named scientific inputs and model components describe the system being
# modelled and therefore have no package-wide entries.
MGEs: {}
spatial_binnings: {}
potential: {}
kinematic_data: {}
# Each entry references its own ECSV data_file and a shared spatial_binning;
# population data are never embedded in a kinematics file and do not use MGEs.
population_data: {}

orbit_library_settings:
  orbit_sampler:
    type: "Grid"
    nE: 6
    nI2: 5
    nI3: 4
  dithering:
    type: "Cubic"
    n_dither: 1
  quad_nr: 10
  quad_nth: 6
  quad_nph: 6
  orbital_periods: 200
  n_stored_timesteps: 50000
  starting_orbit: 1
  accuracy: 1.0e-5
  # A negative value generates a seed; zero or a positive integer uses that
  # value as the seed for a reproducible run.
  random_seed: -1

weight_solver_settings:
  type: "NNLS"
  # cvxopt/scipy are no longer supported -- only JAX-native NNLS solvers
  # will be. Which one(s) is still undecided; "TBD" is a placeholder, not a
  # real option.
  nnls_solver: "TBD"
  maxiter_factor: 3
  regularisation: 0
  lum_intr_rel_err: 0.01
  sb_proj_rel_err: 0.01
  reattempt_failures: true

parameter_space_settings:
  generator_type: "GridSearch"
  which_chi2: "kinchi2"
  potential_rescalings:
    # Scale the fully assembled potential independently of its ordinary
    # component parameters. Disabled settings remain present and validated.
    enabled: false
    range_count: 10
    mass_scale_range:
      minimum: 0.1
      maximum: 10.0
    spacing: "logarithmic"
  generator_settings:
    # Modes: "absolute" or "fraction_of_sqrt_2n_observations".
    delta_chi2_threshold:
      mode: "fraction_of_sqrt_2n_observations"
      value: 0.1
  stopping_criteria:
    # Modes: "absolute" or "relative".
    # Set enabled false to leave another criterion or the parameter generator
    # responsible for ending the search. This does not disable termination
    # when the search has never established a successful model. Mode and value
    # remain validated.
    minimum_delta_chi2:
      enabled: true
      mode: "absolute"
      value: 0.5
    n_max_mods: 3
    n_max_iter: 10

analysis_settings:
  orbit_decomposition:
    # Circularity lambda_z thresholds. The hot component lies between the
    # counter-rotating warm maximum and the warm minimum.
    circularity_thresholds:
      cold_min: 0.8
      warm_min: 0.25
      counter_rotating_warm_max: -0.25
      counter_rotating_cold_max: -0.8
    component_naming: "bulge_disk"
    cache: true
    write_component_weights: false
  kinematic_moments:
    # Derive mean velocity and dispersion by fitting a Gaussian to the LOSVD.
    velocity_dispersion_method: "gaussian_fit"

# The user profile must add input_directory and output_directory. Keeping them
# absent prevents an incomplete configuration from writing into the current
# working directory accidentally.
io_settings:
  all_models_file: "all_models.ecsv"

execution_settings:
  # Reserved for future schedulers. These counts are validated and retained in
  # resolved configuration, but currently do not affect execution.
  orbit_workers: "all_available"
  weight_workers: "all_available"
  external_chi2_workers: "all_available"
  # "model_by_model" completes orbit integration and weight solving for each
  # model in turn. "stage_by_stage" integrates all models' orbit libraries
  # before starting the weight-solving stage, but is not implemented yet and
  # raises NotImplementedError at runtime construction/run.
  model_processing_order: "model_by_model"
  # Passed to Potential.generate_orbit_library, but unused until its orbit
  # integration scaffold is implemented.
  orbit_family_integration_in_parallel: false
