# TNT development configuration for NGC6278.
#
# TNT recursively merges this user profile over the packaged defaults before
# resolving dynamically named potential components and kinematics data sets.
---

system_attributes:
  distance: {value: 39.96, unit: "Mpc"}
  name: "NGC6278"

MGEs:
  mge_lum: "mge_lum.ecsv"

spatial_binnings:
  kinset1_binning:
    min_x: {value: -29.5, unit: "arcsec"}
    min_y: {value: -26.5, unit: "arcsec"}
    x_extent: {value: 58.0, unit: "arcsec"}
    y_extent: {value: 52.0, unit: "arcsec"}
    PA: {value: 126.0, unit: "deg"}
    bins_file: "bins.npy"

potential:
  bh:
    type: "plummer"
    include: true
    parameters:
      m:
        unit: "Msun"
        generator_settings:
          lower_bound: 1.0
          upper_bound: 10.0
          step: 1.0
          minimum_step: 0.0
        fixed: true
        value: 5.0
        logarithmic: true
        latex_label: "$\\log(M_\\mathrm{BH}/M_\\odot)$"
      a:
        unit: "kpc"
        fixed: true
        value: 1.0e-3
        latex_label: "$a_\\mathrm{BH}$"

  dh:
    type: "nfw"
    include: true
    parameters:
      c:
        generator_settings:
          lower_bound: 2.0
          upper_bound: 4.0
          step: 1.0
          minimum_step: 0.1
        fixed: true
        value: 3.0
        logarithmic: true
        latex_label: "$\\log(C)$"
      f:
        generator_settings:
          lower_bound: 0.0
          upper_bound: 2.0
          step: 0.5
          minimum_step: 0.1
        fixed: true
        value: 1.0
        logarithmic: true
        latex_label: "$\\log(M_{200}/M_\\mathrm{stars})$"

  stars:
    type: "triaxial_light_mge"
    include: true
    mge: "mge_lum"
    parameters:
      q:
        generator_settings:
          lower_bound: 0.05
          upper_bound: 0.99
          step: 0.04
          minimum_step: 0.02
        fixed: true
        value: 0.54
        latex_label: "$q_\\mathrm{min}$"
      p:
        generator_settings:
          lower_bound: 0.99
          upper_bound: 0.999
          step: 0.02
          minimum_step: 0.01
        fixed: true
        value: 0.99
        latex_label: "$p_\\mathrm{min}$"
      u:
        generator_settings:
          lower_bound: 0.95
          upper_bound: 1.0
          step: 0.01
          minimum_step: 0.01
        fixed: true
        value: 0.9999
        latex_label: "$u_\\mathrm{min}$"
      ml:
        unit: "Msun / Lsun"
        generator_settings:
          lower_bound: 1.0
          upper_bound: 9.0
          step: 4.0
          minimum_step: 0.5
        fixed: false
        value: 5.0
        latex_label: "$Y_\\mathrm{r}$"

kinematic_data:
  kinset1:
    type: "gauss_hermite"
    binning: "kinset1_binning"
    mge: "mge_lum"
    maximum_gh_order: 4
    observational_errors:
      systematic_uncertainties:
        v: {value: 0.0, unit: "km / s"}
        sigma: {value: 0.0, unit: "km / s"}
        h3: 0.0
        h4: 0.0
    histogram:
      width: {value: 2719.8215332031, unit: "km / s"}
      center: {value: 0.0, unit: "km / s"}
      bins: 203
    data_file: "gauss_hermite_kins.ecsv"

population_data:
  stellar_populations:
    data_file: "populations.ecsv"
    binning: "kinset1_binning"

orbit_library_settings:
  orbit_sampler:
    type: "Grid"
    logrmin: -0.101275
    logrmax: 1.99123
    nE: 6
    nI2: 5
    nI3: 4
  dithering:
    type: "Cubic"
    n_dither: 1
  quad_nr: 10
  quad_nth: 6
  quad_nph: 6
  orbital_periods: 200
  n_stored_timesteps: 50000
  starting_orbit: 1
  accuracy: 1.0e-5
  # A nonnegative integer is an explicit reproducible seed.
  random_seed: 4242

weight_solver_settings:
  type: "NNLS"
  nnls_solver: "TBD"
  maxiter_factor: 3
  regularisation: 0
  lum_intr_rel_err: 0.01
  sb_proj_rel_err: 0.02
  reattempt_failures: true

parameter_space_settings:
  generator_type: "SinglePoint"
  which_chi2: "kinchi2"
  potential_rescalings:
    enabled: true
    range_count: 10
    mass_scale_range:
      minimum: 0.1
      maximum: 10.0
    spacing: "logarithmic"
  generator_settings: {}
  stopping_criteria:
    minimum_delta_chi2:
      enabled: true
      mode: "absolute"
      value: 0.5
    n_max_mods: 3
    n_max_iter: 10

io_settings:
  input_directory: "NGC6278_input/"
  output_directory: "NGC6278_output/"
  all_models_file: "all_models.ecsv"

execution_settings:
  orbit_workers: "all_available"
  weight_workers: "all_available"
  model_processing_order: "model_by_model"
  orbit_family_integration_in_parallel: true
