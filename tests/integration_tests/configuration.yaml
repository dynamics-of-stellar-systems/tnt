# TNT development configuration for NGC6278.
#
# TNT recursively merges this user profile over the packaged defaults before
# resolving dynamically named potential components and kinematics data sets.
---

system_attributes:
  distance: {value: 39.96, unit: "Mpc"}
  name: "NGC6278"

MGEs:
  mge_lum: "mge_lum.ecsv"

spatial_binnings:
  kinset1_binning:
    min_x: {value: -29.5, unit: "arcsec"}
    min_y: {value: -26.5, unit: "arcsec"}
    x_extent: {value: 58.0, unit: "arcsec"}
    y_extent: {value: 52.0, unit: "arcsec"}
    PA: {value: 126.0, unit: "deg"}
    bins_file: "bins.npy"

potential:
  bh:
    type: "PlummerPotential"
    include: true
    parameters:
      m_tot:
        unit: "Msun"
        fixed: true
        value: 1.0e+5
        latex_label: "$M_\\mathrm{BH}/M_\\odot$"
      r_s:
        unit: "kpc"
        fixed: true
        value: 1.0e-3
        latex_label: "$a_\\mathrm{BH}$"

  dh:
    type: "NFWPotential"
    parameterization: "concentration_m200"
    include: true
    parameters:
      c:
        fixed: true
        value: 3.0
        latex_label: "$C$"
      M_200:
        unit: "Msun"
        fixed: true
        value: 1.0e+12
        latex_label: "$M_{200}/M_\\odot$"

  stars:
    type: "TriaxialLightMGEPotential"
    include: true
    mge: "mge_lum"
    parameters:
      theta:
        unit: "rad"
        fixed: true
        # Verified against the committed mge_lum.ecsv fixture to deproject
        # to physically valid (0 < q <= p <= 1) intrinsic axial ratios for
        # every Gaussian component -- unlike this value's predecessor
        # (theta=1.0, phi=0.5, psi=0.0), which produced q > 1 (see PR #32
        # audit, aidocs/pr-32-mge-to-galax-audit.md).
        value: 0.4280191007651427
        latex_label: "$\\theta$"
      phi:
        unit: "rad"
        fixed: true
        value: 1.0363519257903688
        latex_label: "$\\phi$"
      psi:
        unit: "rad"
        fixed: true
        value: 2.0332058150420305
        latex_label: "$\\psi$"
      ml:
        unit: "Msun / Lsun"
        prior: {distribution: "Uniform", args: [1.0, 9.0]}
        fixed: false
        value: 5.0
        latex_label: "$Y_\\mathrm{r}$"

kinematic_data:
  kinset1:
    type: "gauss_hermite"
    binning: "kinset1_binning"
    mge: "mge_lum"
    maximum_gh_order: 4
    observational_errors:
      systematic_uncertainties:
        v: {value: 0.0, unit: "km / s"}
        sigma: {value: 0.0, unit: "km / s"}
        h3: 0.0
        h4: 0.0
    histogram:
      width: {value: 2719.8215332031, unit: "km / s"}
      center: {value: 0.0, unit: "km / s"}
      bins: 203
    data_file: "gauss_hermite_kins.ecsv"

population_data:
  stellar_populations:
    data_file: "populations.ecsv"
    binning: "kinset1_binning"

orbit_library_settings:
  orbit_sampler:
    type: "Grid"
    logrmin: -0.101275
    logrmax: 1.99123
    nE: 6
    nI2: 5
    nI3: 4
  dithering:
    type: "Cubic"
    n_dither: 1
  quad_nr: 10
  quad_nth: 6
  quad_nph: 6
  orbital_periods: 200
  n_stored_timesteps: 50000
  starting_orbit: 1
  accuracy: 1.0e-5
  # A nonnegative integer is an explicit reproducible seed.
  random_seed: 4242

weight_solver_settings:
  type: "NNLS"
  nnls_solver: "TBD"
  maxiter_factor: 3
  regularisation: 0
  lum_intr_rel_err: 0.01
  sb_proj_rel_err: 0.02
  reattempt_failures: false

parameter_space_settings:
  generator_type: "SinglePoint"
  which_chi2: "kinchi2"
  priors: {}
  potential_rescalings:
    enabled: true
    range_count: 10
    mass_scale_range:
      minimum: 0.1
      maximum: 10.0
    spacing: "logarithmic"
  generator_settings: {}
  stopping_criteria:
    minimum_delta_chi2:
      enabled: true
      mode: "absolute"
      value: 0.5
    target_model_count: 3
    n_new_iter: 10
    max_new_mods_per_iter: 10

io_settings:
  input_directory: "NGC6278_input/"
  output_directory: "NGC6278_output/"
  all_models_file: "all_models.ecsv"

execution_settings:
  orbit_workers: "all_available"
  weight_workers: "all_available"
  model_processing_order: "model_by_model"
